[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
# Registries hold no value; a revert-on-overflow default is the right trade.
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
# The deploy script writes the address book the API and anchor worker read.
fs_permissions = [{access = "read-write", path = "./deployments"}, {access = "read", path = "./out"}]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 4096

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
